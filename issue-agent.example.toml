[runtime]
repo = "/opt/agent-dev/repo"
worktrees = "/opt/agent-dev/worktrees"
state_db = "/opt/agent-dev/state/orchestrator.sqlite3"
log_dir = "/opt/agent-dev/logs"
poll_seconds = 60
fetch_ttl_seconds = 30
max_workers = 3
# max_active_issues: how many issues may be implemented at once. 1 (default)
#   finishes one issue end to end before starting the next; raise it to spread
#   agent capacity across several in-flight issues.
max_active_issues = 1
max_attempts = 3
max_task_attempts = 2
default_agent = "codex"
reviewer_agent = "claude"
planner_agent = "claude"
max_tasks = 8
auto_plan_unlabeled = true
auto_plan_limit = 20
# ready_poll_limit: how many ready/agent-running issues one poll may list.
#   The merge is sorted by issue number, so the oldest backlog drains first.
ready_poll_limit = 20
dry_run = false

# Workflow gates. All default to off; enable per repository.
# auto_ready_with_plan: when an issue body already carries a concrete plan,
#   publish it and add the ready label instead of waiting for human approval.
#   Only applies to the planner-skip path, so LLM-written plans still need review.
auto_ready_with_plan = false
# allow_split: let the planner split an oversized issue into independent child
#   issues. Children never get the ready label automatically.
allow_split = false
max_split_children = 5
# max_clarify_rounds: how many live question rounds the planner gets (each
#   answer is picked up automatically). After the budget is spent one final
#   handoff comment is posted and the issue parks for a human reset.
max_clarify_rounds = 2
# clarify_ignore_authors: extra comment authors (beyond this machine's login)
#   that never count as a human answer to a planner question.
clarify_ignore_authors = []

# Optional weekly admission windows (uncomment to enable; restart after editing).
# No allow rules means all times are allowed except deny rules; deny wins overlaps.
# Omitted days means every day; overnight windows belong to their starting weekday.
# Already started Issues finish even after the window closes.
# [schedule]
# timezone = "Asia/Shanghai" # Omit to use the system local timezone.
# [[schedule.deny]]
# days = ["mon", "tue", "wed", "thu", "fri"]
# start = "09:00"
# end = "18:00"
# Alternatively, allow only nights every day:
# [[schedule.allow]]
# start = "18:00"
# end = "09:00"

[github]
repo = "OWNER/REPO"
base_branch = "main"
ready_label = "agent-ready"

[checks]
commands = ["ruff check .", "pytest -q"]
# Fast checks after each plan task. Use [] to defer all configured checks to the final gate.
task_commands = ["ruff check ."]
timeout_seconds = 1800
max_workers = 2
baseline_cache_ttl_seconds = 300
baseline_cache_max_entries = 32
# Run multiple check commands concurrently; set false if they contend in the worktree.
parallel = true

# Per-task review mode. formal (default): deterministic secrets/forbidden-file/empty-diff
# checks, no LLM calls; full: read-only LLM review of each task commit via reviewer_agent;
# off: skip per-task review. The final whole-branch review always runs when reviewer_agent
# is configured, regardless of this setting.
[review]
task_mode = "formal"

# CodeGraph (form B): when the target repo's main checkout has a .codegraph/ index,
# planner/worker/reviewer prompts gain a guidance block pointing agents at the
# codegraph MCP tools (or read-only CLI). The index is user-maintained:
# codegraph init / codegraph watch / codegraph install. Disable to keep prompts unchanged.
[codegraph]
enabled = true

# If {prompt} is absent, the prompt is sent through stdin (safer for long Issues).
[agents.codex]
command = "codex exec --json --sandbox workspace-write -"
resume_command = "codex exec resume --json {session_id} -"
max_workers = 2
timeout_seconds = 7200

[agents.claude]
command = "claude -p --output-format json"
review_command = "claude -p --permission-mode plan --output-format json"
resume_command = "claude -p --resume {session_id} --output-format json"
review_resume_command = "claude -p --resume {session_id} --permission-mode plan --output-format json"
max_workers = 1
timeout_seconds = 7200

[agents.opencode]
command = "opencode run -"
enabled = false
max_workers = 1

# Any CLI can be integrated. Use {prompt} only when it cannot read stdin.
[agents.custom]
command = "my-agent --prompt {prompt}"
enabled = false
