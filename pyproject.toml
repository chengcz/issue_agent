[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-orchestrator"
version = "0.1.0"
description = "Issue-driven, multi-provider coding agent orchestrator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
cao = "coding_agent_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

